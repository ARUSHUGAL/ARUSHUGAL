<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Arush Ugal</title>
  <desc id="desc">Dark Demon Slayer inspired banner with a green and black checkered haori pattern, a crimson sun, and a Nichirin blade.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060A09"/>
      <stop offset="0.5" stop-color="#0B1512"/>
      <stop offset="1" stop-color="#08100D"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#F05A4F"/>
      <stop offset="0.55" stop-color="#C8102E"/>
      <stop offset="1" stop-color="#6E0710"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#151A18"/>
      <stop offset="0.35" stop-color="#AEB7B1"/>
      <stop offset="0.5" stop-color="#F5F2E8"/>
      <stop offset="0.65" stop-color="#8D9791"/>
      <stop offset="1" stop-color="#202623"/>
    </linearGradient>
    <pattern id="checker" width="72" height="72" patternUnits="userSpaceOnUse">
      <rect width="72" height="72" fill="#07100D"/>
      <rect width="36" height="36" fill="#1F5C49"/>
      <rect x="36" y="36" width="36" height="36" fill="#1F5C49"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <g stroke="#DDE6DF" stroke-width="1" opacity="0.035">
    <path d="M-100 360L360 -100M0 360L460 -100M100 360L560 -100M200 360L660 -100M300 360L760 -100M400 360L860 -100M500 360L960 -100M600 360L1060 -100M700 360L1160 -100M800 360L1260 -100M900 360L1360 -100"/>
  </g>

  <g transform="rotate(-34 960 180)" opacity="0.9">
    <rect x="700" y="172" width="520" height="16" rx="8" fill="url(#blade)"/>
    <rect x="700" y="178" width="520" height="4" fill="#C8102E" opacity="0.9"/>
    <rect x="680" y="168" width="26" height="24" rx="4" fill="#1F5C49"/>
    <rect x="672" y="166" width="10" height="28" rx="5" fill="#E6C15A"/>
  </g>

  <circle cx="975" cy="172" r="120" fill="url(#sun)"/>
  <circle cx="975" cy="172" r="120" fill="none" stroke="#E6C15A" stroke-width="2" opacity="0.75"/>
  <g transform="translate(975 172)" stroke="#C8102E" stroke-width="5" stroke-linecap="round" opacity="0.6">
    <path d="M0 -145V-162M0 145V162M-145 0H-162M145 0H162M-103 -103L-117 -117M103 103L117 117M-103 103L-117 117M103 -103L117 -117"/>
  </g>

  <rect width="1200" height="28" fill="url(#checker)"/>
  <rect y="332" width="1200" height="28" fill="url(#checker)"/>

  <g fill="#E7A6B8" opacity="0.45">
    <ellipse cx="760" cy="80" rx="7" ry="4" transform="rotate(-30 760 80)"/>
    <ellipse cx="820" cy="300" rx="6" ry="3.5" transform="rotate(20 820 300)"/>
    <ellipse cx="1110" cy="260" rx="6" ry="3.5" transform="rotate(-15 1110 260)"/>
    <ellipse cx="690" cy="220" rx="5" ry="3" transform="rotate(40 690 220)"/>
  </g>

  <text x="80" y="172" font-family="'Hiragino Mincho ProN','Yu Mincho',Georgia,'Times New Roman',serif" font-size="84" font-weight="700" letter-spacing="6" fill="#F5F2E8">ARUSH UGAL</text>
  <text x="84" y="222" font-family="'Helvetica Neue',Arial,sans-serif" font-size="20" letter-spacing="8" fill="#E6C15A">SECURITY · AI · FULL-STACK</text>
  <text x="84" y="256" font-family="'Helvetica Neue',Arial,sans-serif" font-size="13" letter-spacing="5" fill="#9DB3A9">BACKEND ENGINEER WITH A BLUE-TEAM SEAT</text>
  <rect x="84" y="284" width="112" height="34" rx="4" fill="#C8102E"/>
  <text x="140" y="307" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="18" letter-spacing="2" fill="#F5F2E8">全集中</text>
